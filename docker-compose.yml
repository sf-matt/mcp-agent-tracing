version: "3.8"
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    environment:
      GROUNDCOVER_TOKEN: "${GROUNDCOVER_TOKEN:-}"
      GC_CLUSTER: "${GC_CLUSTER:-matthew-local}"
      GC_ENV: "${GC_ENV:-local}"
    ports: ["4317:4317", "4318:4318"]
  mcp-tool-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.mcp-tool-server
    ports: ["9000:9000"]
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
    depends_on: [otel-collector]
  agent2:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent2
    ports: ["9002:9002"]
    environment:
      TOOL_SERVER_URL: "http://mcp-tool-server:9000/mcp"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
    depends_on: [mcp-tool-server, otel-collector]
  agent3:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent3
    ports: ["9003:9003"]
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      FAKE_LLM: "${FAKE_LLM:-}"
    depends_on: [otel-collector]
  agent3-openllmetry:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent3
    ports: ["9013:9003"]
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      FAKE_LLM: "${FAKE_LLM:-}"
      ENABLE_OPENLLMETRY: "1"
      SERVICE_NAME: "agent-3-openllmetry"
      SPAN_FILE: "spans_agent3_openllmetry.jsonl"
    depends_on: [otel-collector]
  agent4:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent4
    ports: ["9004:9004"]
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
    depends_on: [otel-collector]
  agent5:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent5
    ports: ["9005:9005"]
    # Deliberately no OTEL_EXPORTER_OTLP_ENDPOINT -- agent5 has no OTel
    # code to read it anyway.
  agent1:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent1
    ports: ["9001:9001"]
    environment:
      AGENT2_URL: "http://agent2:9002/process"
      AGENT3_URL: "http://agent3:9003/summarize"
      AGENT3_OPENLLMETRY_URL: "http://agent3-openllmetry:9003/summarize"
      AGENT4_URL: "http://agent4:9004/audit"
      AGENT5_URL: "http://agent5:9005/ghost-task"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      FAKE_LLM: "${FAKE_LLM:-}"
    depends_on: [agent2, agent3, agent3-openllmetry, agent4, agent5, otel-collector]
  agent6:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent6
    ports: ["9006:9006"]
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      ENABLE_SDK_TELEMETRY: "${ENABLE_SDK_TELEMETRY:-}"
    depends_on: [otel-collector]
