apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-tool-server
  namespace: mcp-agent-tracing-platform
spec:
  replicas: 1
  selector:
    matchLabels: {app: mcp-tool-server}
  template:
    metadata:
      labels: {app: mcp-tool-server}
    spec:
      containers:
        - name: mcp-tool-server
          image: sfmatt/mcp-tool-server:latest
          ports: [{containerPort: 9000}]
          resources:
            requests: {memory: "100Mi", cpu: "50m"}
            limits: {memory: "256Mi", cpu: "500m"}
          env:
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.mcp-agent-tracing.svc.cluster.local:4318"}
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-tool-server
  namespace: mcp-agent-tracing-platform
spec:
  selector: {app: mcp-tool-server}
  ports: [{port: 9000, targetPort: 9000}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent2
  namespace: mcp-agent-tracing-platform
spec:
  replicas: 1
  selector:
    matchLabels: {app: agent2}
  template:
    metadata:
      labels: {app: agent2}
    spec:
      containers:
        - name: agent2
          image: sfmatt/agent2:latest
          ports: [{containerPort: 9002}]
          resources:
            requests: {memory: "100Mi", cpu: "50m"}
            limits: {memory: "256Mi", cpu: "500m"}
          env:
            - {name: TOOL_SERVER_URL, value: "http://mcp-tool-server:9000/mcp"}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.mcp-agent-tracing.svc.cluster.local:4318"}
---
apiVersion: v1
kind: Service
metadata:
  name: agent2
  namespace: mcp-agent-tracing-platform
spec:
  selector: {app: agent2}
  ports: [{port: 9002, targetPort: 9002}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent3
  namespace: mcp-agent-tracing
spec:
  replicas: 1
  selector:
    matchLabels: {app: agent3}
  template:
    metadata:
      labels: {app: agent3}
    spec:
      containers:
        - name: agent3
          image: sfmatt/agent3:latest
          ports: [{containerPort: 9003}]
          resources:
            requests: {memory: "100Mi", cpu: "50m"}
            limits: {memory: "256Mi", cpu: "500m"}
          env:
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector:4318"}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef: {name: anthropic-api-key, key: key, optional: true}
            - {name: FAKE_LLM, value: "1"}
---
apiVersion: v1
kind: Service
metadata:
  name: agent3
  namespace: mcp-agent-tracing
spec:
  selector: {app: agent3}
  ports: [{port: 9003, targetPort: 9003}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent3-openllmetry
  namespace: mcp-agent-tracing
spec:
  replicas: 1
  selector:
    matchLabels: {app: agent3-openllmetry}
  template:
    metadata:
      labels: {app: agent3-openllmetry}
    spec:
      containers:
        - name: agent3-openllmetry
          image: sfmatt/agent3:latest
          ports: [{containerPort: 9003}]
          resources:
            requests: {memory: "256Mi", cpu: "50m"}
            limits: {memory: "512Mi", cpu: "500m"}
          env:
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector:4318"}
            - {name: ENABLE_OPENLLMETRY, value: "1"}
            - {name: SERVICE_NAME, value: "agent-3-openllmetry"}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef: {name: anthropic-api-key, key: key, optional: true}
            - {name: FAKE_LLM, value: "1"}
---
apiVersion: v1
kind: Service
metadata:
  name: agent3-openllmetry
  namespace: mcp-agent-tracing
spec:
  selector: {app: agent3-openllmetry}
  ports: [{port: 9003, targetPort: 9003}]
