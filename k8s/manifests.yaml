# Update sfmatt below before applying.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-tool-server
spec:
  replicas: 1
  selector:
    matchLabels: {app: mcp-tool-server}
  template:
    metadata:
      labels: {app: mcp-tool-server}
    spec:
      containers:
        - name: mcp-tool-server
          image: sfmatt/mcp-tool-server:latest
          ports: [{containerPort: 9000}]
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-tool-server
spec:
  selector: {app: mcp-tool-server}
  ports: [{port: 9000, targetPort: 9000}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent2
spec:
  replicas: 1
  selector:
    matchLabels: {app: agent2}
  template:
    metadata:
      labels: {app: agent2}
    spec:
      containers:
        - name: agent2
          image: sfmatt/agent2:latest
          ports: [{containerPort: 9002}]
---
apiVersion: v1
kind: Service
metadata:
  name: agent2
spec:
  selector: {app: agent2}
  ports: [{port: 9002, targetPort: 9002}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent1
spec:
  replicas: 1
  selector:
    matchLabels: {app: agent1}
  template:
    metadata:
      labels: {app: agent1}
    spec:
      containers:
        - name: agent1
          image: sfmatt/agent1:latest
          ports: [{containerPort: 9001}]
          env:
            # Service DNS names, not localhost -- this is the one thing
            # that has to change between local docker-compose and k8s.
            - {name: TOOL_SERVER_URL, value: "http://mcp-tool-server:9000/mcp"}
            - {name: AGENT2_URL, value: "http://agent2:9002/lookup"}
---
apiVersion: v1
kind: Service
metadata:
  name: agent1
spec:
  selector: {app: agent1}
  ports: [{port: 9001, targetPort: 9001}]
