apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent1
  namespace: mcp-agent-tracing
spec:
  replicas: 1
  selector:
    matchLabels: {app: agent1}
  template:
    metadata:
      labels: {app: agent1}
    spec:
      containers:
        - name: agent1
          image: sfmatt/agent1:latest
          ports: [{containerPort: 9001}]
          resources:
            requests: {memory: "100Mi", cpu: "50m"}
            limits: {memory: "256Mi", cpu: "500m"}
          env:
            - {name: AGENT2_URL, value: "http://agent2.mcp-agent-tracing-platform.svc.cluster.local:9002/process"}
            - {name: AGENT3_URL, value: "http://agent3:9003/summarize"}
            - {name: AGENT3_OPENLLMETRY_URL, value: "http://agent3-openllmetry:9003/summarize"}
            - {name: AGENT4_URL, value: "http://agent4:9004/audit"}
            - {name: AGENT5_URL, value: "http://agent5:9005/ghost-task"}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector:4318"}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef: {name: anthropic-api-key, key: key, optional: true}
            - {name: FAKE_LLM, value: "1"}
---
