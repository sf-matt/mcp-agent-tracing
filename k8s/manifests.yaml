apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent6
  namespace: mcp-agent-tracing
spec:
  replicas: 1
  selector:
    matchLabels: {app: agent6}
  template:
    metadata:
      labels: {app: agent6}
    spec:
      containers:
        - name: agent6
          image: sfmatt/agent6:latest
          ports: [{containerPort: 9006}]
          resources:
            requests: {memory: "256Mi", cpu: "100m"}
            limits: {memory: "512Mi", cpu: "1000m"}
          env:
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector:4318"}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef: {name: anthropic-api-key, key: key, optional: true}
            - name: CLAUDE_CODE_OAUTH_TOKEN
              valueFrom:
                secretKeyRef: {name: claude-oauth-token, key: token, optional: true}
            - {name: ENABLE_SDK_TELEMETRY, value: "1"}
---
apiVersion: v1
kind: Service
metadata:
  name: agent6
  namespace: mcp-agent-tracing
spec:
  selector: {app: agent6}
  ports: [{port: 9006, targetPort: 9006}]
