# Update sfmatt below before applying.
# Requires a Secret named "anthropic-api-key" with key "key", created out-of-band:
#   kubectl create secret generic anthropic-api-key --from-literal=key='<your-anthropic-key>' -n mcp-agent-tracing
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-tool-server
  namespace: mcp-agent-tracing
spec:
  replicas: 1
  selector:
    matchLabels: {app: mcp-tool-server}
  template:
    metadata:
      labels: {app: mcp-tool-server}
    spec:
      containers:
        - name: mcp-tool-server
          image: sfmatt/mcp-tool-server:latest
          ports: [{containerPort: 9000}]
          env:
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector:4318"}
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-tool-server
  namespace: mcp-agent-tracing
spec:
  selector: {app: mcp-tool-server}
  ports: [{port: 9000, targetPort: 9000}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent2
  namespace: mcp-agent-tracing
spec:
  replicas: 1
  selector:
    matchLabels: {app: agent2}
  template:
    metadata:
      labels: {app: agent2}
    spec:
      containers:
        - name: agent2
          image: sfmatt/agent2:latest
          ports: [{containerPort: 9002}]
          env:
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector:4318"}
---
apiVersion: v1
kind: Service
metadata:
  name: agent2
  namespace: mcp-agent-tracing
spec:
  selector: {app: agent2}
  ports: [{port: 9002, targetPort: 9002}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent1
  namespace: mcp-agent-tracing
spec:
  replicas: 1
  selector:
    matchLabels: {app: agent1}
  template:
    metadata:
      labels: {app: agent1}
    spec:
      containers:
        - name: agent1
          image: sfmatt/agent1:latest
          ports: [{containerPort: 9001}]
          env:
            # Service DNS names, not localhost -- this is the one thing
            # that has to change between local docker-compose and k8s.
            - {name: TOOL_SERVER_URL, value: "http://mcp-tool-server:9000/mcp"}
            - {name: AGENT2_URL, value: "http://agent2:9002/lookup"}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector:4318"}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef: {name: anthropic-api-key, key: key, optional: true}
            # FAKE_LLM=1: local loopback responder instead of the real
            # Anthropic API -- remove this once the secret above is real
            # and you want the genuine API call in the trace.
            - {name: FAKE_LLM, value: "1"}
---
apiVersion: v1
kind: Service
metadata:
  name: agent1
  namespace: mcp-agent-tracing
spec:
  selector: {app: agent1}
  ports: [{port: 9001, targetPort: 9001}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent1-openllmetry
  namespace: mcp-agent-tracing
spec:
  replicas: 1
  selector:
    matchLabels: {app: agent1-openllmetry}
  template:
    metadata:
      labels: {app: agent1-openllmetry}
    spec:
      containers:
        - name: agent1-openllmetry
          image: sfmatt/agent1:latest
          ports: [{containerPort: 9001}]
          env:
            - {name: TOOL_SERVER_URL, value: "http://mcp-tool-server:9000/mcp"}
            - {name: AGENT2_URL, value: "http://agent2:9002/lookup"}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector:4318"}
            - {name: ENABLE_OPENLLMETRY, value: "1"}
            - {name: SERVICE_NAME, value: "agent-1-openllmetry"}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef: {name: anthropic-api-key, key: key, optional: true}
            # FAKE_LLM=1: local loopback responder instead of the real
            # Anthropic API -- remove this once the secret above is real
            # and you want the genuine API call in the trace.
            - {name: FAKE_LLM, value: "1"}
---
apiVersion: v1
kind: Service
metadata:
  name: agent1-openllmetry
  namespace: mcp-agent-tracing
spec:
  selector: {app: agent1-openllmetry}
  ports: [{port: 9001, targetPort: 9001}]
