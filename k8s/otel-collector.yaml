apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-env
  namespace: mcp-agent-tracing
data:
  GC_CLUSTER: matthew-local
  GC_ENV: local
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  namespace: mcp-agent-tracing
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-collector-k8s-attributes
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-collector-k8s-attributes
subjects:
  - kind: ServiceAccount
    name: otel-collector
    namespace: mcp-agent-tracing
roleRef:
  kind: ClusterRole
  name: otel-collector-k8s-attributes
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: mcp-agent-tracing
spec:
  replicas: 1
  selector:
    matchLabels: {app: otel-collector}
  template:
    metadata:
      labels: {app: otel-collector}
    spec:
      serviceAccountName: otel-collector
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.96.0
          args: ["--config=/etc/otelcol-contrib/config.yaml"]
          ports:
            - {containerPort: 4317}
            - {containerPort: 4318}
          resources:
            requests: {memory: "150Mi", cpu: "50m"}
            limits: {memory: "384Mi", cpu: "500m"}
          envFrom:
            - configMapRef:
                name: otel-collector-env
          env:
            - name: GROUNDCOVER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: groundcover-token
                  key: token
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol-contrib/config.yaml
              subPath: config.yaml
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: mcp-agent-tracing
spec:
  selector: {app: otel-collector}
  ports:
    - {name: otlp-grpc, port: 4317, targetPort: 4317}
    - {name: otlp-http, port: 4318, targetPort: 4318}
