# How data gets in. Every agent's OTEL_EXPORTER_OTLP_ENDPOINT points here.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

# In-flight transformations.
processors:
  batch:
    timeout: 5s
    send_batch_size: 512

  # Enriches each item with the sender's real k8s.pod.name/namespace/node/deployment, looked up against the k8s API via this ServiceAccount's RBAC.
  k8sattributes:
    auth_type: "serviceAccount"
    extract:
      metadata:
        - k8s.pod.name
        - k8s.pod.uid
        - k8s.namespace.name
        - k8s.node.name
        - k8s.deployment.name
    pod_association:
      - sources:
          - from: connection

  # Stamps cluster/env from env vars into each item, so Groundcover can group and filter by them.
  resource/groundcover:
    attributes:
      - key: cluster
        value: ${env:GC_CLUSTER}
        action: insert
      - key: env
        value: ${env:GC_ENV}
        action: insert

# Data exit
exporters:
  # Local troubleshooting only.
  debug:
    verbosity: detailed

  # Real export to Groundcover's OTLP endpoint, with auth and compression.
  otlphttp/groundcover:
    endpoint: https://experiments.platform-dev.grcv.io
    headers:
      Authorization: ${env:GROUNDCOVER_TOKEN}
    compression: gzip
    timeout: 30s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s

# The actual wiring: per signal, which receivers/processors/exporters apply.
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [k8sattributes, resource/groundcover, batch]
      exporters: [debug, otlphttp/groundcover]
    logs:
      receivers: [otlp]
      processors: [k8sattributes, resource/groundcover, batch]
      exporters: [debug, otlphttp/groundcover]
    metrics:
      receivers: [otlp]
      processors: [k8sattributes, resource/groundcover, batch]
      exporters: [debug, otlphttp/groundcover]
